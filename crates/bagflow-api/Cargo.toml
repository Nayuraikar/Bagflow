[package]
name = "bagflow-api"
version = "0.1.0"
edition = "2021"

[dependencies]
bagflow-core = { path = "../bagflow-core" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.5", features = ["cors"] }
serde_json = { workspace = true }
