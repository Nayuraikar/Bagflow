name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Optional for the build; installed so that the OpenMP kernel is tested.
      - name: Install libomp
        if: runner.os == 'macOS'
        run: brew install libomp

      # No GPU is needed: CUDA is skipped without nvcc, and the Metal tests skip without a usable device.
      - name: Install the Rust version in rust-toolchain.toml
        run: rustup toolchain install

      - name: Rust tests
        run: cargo test --release

      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web packages
        run: npm ci
        working-directory: web

      - name: Web build
        run: npm run build
        working-directory: web

      - name: Web lint
        run: npm run lint
        working-directory: web
